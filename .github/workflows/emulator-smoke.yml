name: Android full-screen emulator QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/emulator-smoke.yml'

permissions:
  contents: read

concurrency:
  group: focuslock-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build app and UI tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run usage permission and full-screen screenshot QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell appops set com.haebi.focuslock GET_USAGE_STATS ignore
            adb shell am instrument -w -r -e class 'com.haebi.focuslock.FocusLockScreenQaTest#onboardingAndPermissionDeniedScreens' com.haebi.focuslock.test/androidx.test.runner.AndroidJUnitRunner
            adb shell appops set com.haebi.focuslock GET_USAGE_STATS allow
            adb shell am start -a android.settings.SETTINGS
            sleep 45
            adb shell input keyevent KEYCODE_HOME
            adb shell am instrument -w -r -e class 'com.haebi.focuslock.FocusLockScreenQaTest#grantedUsageAndDetailScreens' com.haebi.focuslock.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p captures
            adb pull /sdcard/Android/data/com.haebi.focuslock/files/qa-captures/ captures/
            test "$(find captures -name '*.png' | wc -l)" -ge 15
      - name: Upload all captured screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focuslock-android-fullscreen-captures
          path: captures/
          if-no-files-found: warn
          retention-days: 14
