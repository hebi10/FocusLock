name: Play internal release

on:
  # RENEW release freeze: no Play upload from successful Android CI or main pushes.
  # Store images and AABs must be explicitly released only after the full renewal.
  workflow_dispatch:
    inputs:
      ops01_release_approved:
        description: 'Only after all planned features and final QA have passed'
        type: boolean
        required: true
        default: false
      mode:
        description: 'check = Play access; icon = icon; build = AAB; initialize = draft; deploy = internal; closed = promote latest completed internal to closed'
        required: true
        type: choice
        default: check
        options: [check, icon, build, initialize, deploy, closed]
      version_code:
        description: 'Build-only versionCode (minimum/default 1); deploy allocates above all Play artifacts'
        type: string
        default: '1'
      release_status:
        description: 'completed = API release; draft = Console draft, neither guarantees installability'
        type: choice
        default: completed
        options: [completed, draft]
      changes_not_sent_for_review:
        description: 'Keep committed changes pending explicit Console review submission'
        type: boolean
        default: false
      expected_internal_version_code:
        description: 'Optional expected completed internal versionCode for exact closed promotion'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: play-com-haebi-focuslock
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      mode: ${{ steps.source.outputs.release_mode }}
    steps:
      - name: OPS-01 reject unapproved Play mutation
        if: inputs.mode == 'icon' || inputs.mode == 'initialize' || inputs.mode == 'deploy' || inputs.mode == 'closed'
        env:
          OPS01_RELEASE_APPROVED: ${{ inputs.ops01_release_approved }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$OPS01_RELEASE_APPROVED" = true
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact main source and successful Android and emulator jobs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PLAY_REQUESTED_MODE: ${{ inputs.mode }}
          PLAY_CI_WAIT_SECONDS: ${{ github.event_name == 'workflow_run' && '3000' || '0' }}
        run: python3 scripts/play/source.py

  gates:
    needs: source
    uses: ./.github/workflows/play-gates.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}

  release:
    needs: [source, gates]
    if: needs.source.outputs.mode == 'build' || needs.source.outputs.mode == 'deploy' || (needs.source.outputs.mode == 'initialize' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: google-play
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true
      - name: Reject superseded source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/play/source.py --assert-current "$SOURCE_SHA"
      - name: Provision the existing app release signer without replacement or generation
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          python3 scripts/release_signing.py prepare --keystore "$RUNNER_TEMP/focuslock-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/focuslock-release.jks" >> "$GITHUB_ENV"
      - name: Check Play authentication configuration
        id: credentials
        if: needs.source.outputs.mode == 'deploy' || needs.source.outputs.mode == 'initialize'
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: python3 scripts/play/preflight.py auth
      - name: Authenticate with Workload Identity Federation
        id: wif
        if: (needs.source.outputs.mode == 'deploy' || needs.source.outputs.mode == 'initialize') && steps.credentials.outputs.auth_mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Verify registered binary before normal API deployment
        id: readiness
        if: needs.source.outputs.mode == 'deploy'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token }}
        run: python3 scripts/play/publisher.py --report output/play-readiness.json inspect --require-binary
      - name: Allocate version above every Play bundle APK and track
        id: version
        if: needs.source.outputs.mode == 'deploy' || needs.source.outputs.mode == 'initialize'
        env:
          PLAY_CONSOLE_INITIALIZED: ${{ steps.readiness.outputs.initialized }}
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token }}
          PLAY_RELEASE_MODE: ${{ needs.source.outputs.mode }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          if [[ "$PLAY_RELEASE_MODE" == 'initialize' ]]; then
            python3 scripts/play/publisher.py --report output/play-allocation.json allocate-first
          else
            python3 scripts/play/publisher.py --report output/play-allocation.json allocate
          fi
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned build and verification tools
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          python3 scripts/play/prepare_bundletool.py "$RUNNER_TEMP/bundletool.jar"
      - name: Build release AAB and APK with the existing release signer
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code || inputs.version_code || '1' }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache lintRelease bundleRelease assembleRelease
      - name: Verify exact package version name and allocated code in both artifacts
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code || inputs.version_code || '1' }}
        run: python3 scripts/play/artifacts.py --bundle app/build/outputs/bundle/release/app-release.aab --apk app/build/outputs/apk/release/app-release.apk --bundletool "$RUNNER_TEMP/bundletool.jar" --aapt2 "${ANDROID_HOME}/build-tools/36.0.0/aapt2" --version-code "$VERSION_CODE"
      - name: Verify AAB and APK match the existing app certificate
        run: |
          python3 scripts/play/preflight.py verify-bundle --bundle app/build/outputs/bundle/release/app-release.aab
          python3 scripts/release_signing.py verify-apk --apk app/build/outputs/apk/release/app-release.apk --apksigner "${ANDROID_HOME}/build-tools/36.0.0/apksigner"
      - name: Require real release ELF AAB and APK 16 KB checks
        run: python3 scripts/play/verify_native.py --bundle app/build/outputs/bundle/release/app-release.aab --apk app/build/outputs/apk/release/app-release.apk --bundletool "$RUNNER_TEMP/bundletool.jar" --zipalign "${ANDROID_HOME}/build-tools/36.0.0/zipalign" --report output/play-native.json --allow-no-native
      - name: Preserve verified bootstrap AAB and signed APK
        uses: actions/upload-artifact@v4
        with:
          name: focuslock-signed-release-${{ steps.version.outputs.version_code || inputs.version_code || '1' }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Reject stale source immediately before upload
        if: needs.source.outputs.mode == 'deploy' || needs.source.outputs.mode == 'initialize'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/play/source.py --assert-current "$SOURCE_SHA"
      - name: Submit first internal draft only after empty-inventory and artifact verification
        if: needs.source.outputs.mode == 'initialize'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token }}
          PLAY_RELEASE_MODE: ${{ needs.source.outputs.mode }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          python3 scripts/play/publisher.py --report output/play-initialization.json initialize --bundle app/build/outputs/bundle/release/app-release.aab
          echo 'Initial internal draft API upload and fresh hash/track readback passed. No release was published and PLAY_CONSOLE_INITIALIZED was not changed. App Signing and Console state require separate confirmation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Submit internal release and require fresh Play readback
        if: needs.source.outputs.mode == 'deploy'
        env:
          PLAY_CONSOLE_INITIALIZED: ${{ steps.readiness.outputs.initialized }}
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_STATUS: ${{ inputs.release_status || 'completed' }}
          KEEP_FOR_REVIEW: ${{ inputs.changes_not_sent_for_review || false }}
        shell: bash
        run: |
          args=()
          if [[ "$KEEP_FOR_REVIEW" == 'true' ]]; then args+=(--changes-not-sent-for-review); fi
          python3 scripts/play/publisher.py --report output/play-release.json deploy --bundle app/build/outputs/bundle/release/app-release.aab --version-code "$VERSION_CODE" --status "$RELEASE_STATUS" "${args[@]}"
          echo 'Play API commit and fresh readback passed. Console review, publication and tester installability still require confirmation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Report build-only result
        if: needs.source.outputs.mode == 'build'
        run: echo 'Signed bootstrap AAB verified. No Play API call or deployment was performed. Upload this AAB in Console using the existing app certificate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve non-secret release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focuslock-play-report-${{ github.run_id }}
          path: output/play-*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove private signer material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/focuslock-release.jks"

  checked:
    needs: [source, gates]
    if: needs.source.outputs.mode == 'check' || needs.source.outputs.mode == 'icon'
    runs-on: ubuntu-latest
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Play authentication configuration
        id: credentials
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: python3 scripts/play/preflight.py auth
      - name: Authenticate with Workload Identity Federation
        id: wif
        if: steps.credentials.outputs.auth_mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Inspect Play access without uploading or committing
        if: needs.source.outputs.mode == 'check'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token }}
        run: python3 scripts/play/publisher.py --report output/play-preflight.json inspect
      - name: Register approved Play store icon (no release upload)
        if: needs.source.outputs.mode == 'icon'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token }}
          PLAY_RELEASE_MODE: ${{ needs.source.outputs.mode }}
        run: python3 scripts/play/store_icon.py --file assets/store/FocusLock_Play_Icon_512.png --report output/play-icon.json
      - name: Report validation result
        if: always()
        run: |
          echo 'check mode performs read-only validation. icon mode may commit only the approved ko-KR store icon after successful WIF, existing-listing check and SHA-256 verification; neither mode uploads AAB or changes release tracks. Console publication and tester installability remain separate checks.' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f output/play-preflight.json ]]; then cat output/play-preflight.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [[ -f output/play-icon.json ]]; then cat output/play-icon.json >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve non-secret access report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focuslock-play-preflight-${{ github.run_id }}
          path: |
            output/play-preflight.json
            output/play-icon.json
          if-no-files-found: ignore
          retention-days: 30

  closed:
    name: Promote latest completed internal release to closed testing
    needs: [source, gates]
    if: needs.source.outputs.mode == 'closed'
    runs-on: ubuntu-latest
    env:
      MIN_CLOSED_VERSION_CODE: '4'
      EXPECTED_CLOSED_VERSION_CODE: ${{ inputs.expected_internal_version_code || '' }}
      PLAY_REQUESTED_MODE: ${{ inputs.mode || '' }}
    timeout-minutes: 20
    environment: google-play
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require current main and exact SHA Android and emulator verification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/play/source.py --assert-current "$SOURCE_SHA"
      - name: Check Play WIF configuration
        id: credentials
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: python3 scripts/play/preflight.py auth
      - name: Authenticate with Workload Identity Federation
        id: wif
        if: steps.credentials.outputs.auth_mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Inspect latest completed internal bundle and existing closed alpha track (read only)
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token }}
          PLAY_RELEASE_MODE: closed
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/play/closed_promotion.py --report output/play-closed-readiness.json inspect
      - name: Recheck main and both verifications immediately before closed promotion
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/play/source.py --assert-current "$SOURCE_SHA"
      - name: Promote verified latest internal release to closed alpha without another AAB upload
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token }}
          PLAY_RELEASE_MODE: closed
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          python3 scripts/play/closed_promotion.py --report output/play-closed-promotion.json promote
          echo 'Closed alpha API edit and fresh readback validated. Play Console review, app setup, testing group and tester installation still require separate verification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve non-secret closed-track verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focuslock-closed-promotion-${{ github.run_id }}
          path: output/play-closed-*.json
          if-no-files-found: ignore
          retention-days: 30
