name: STORE-02-A FocusLock concepts preview

on:
  pull_request:
    paths:
      - 'scripts/store/render_concepts.py'
      - '.github/workflows/store-02-a-preview.yml'
      - 'docs/play-store/STORE-02-A.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean font and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install 'Pillow==12.0.0'
      - name: Resolve verified latest successful main Android QA
        id: qa
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/emulator-smoke.yml/runs?branch=main&status=success&per_page=30" > "$RUNNER_TEMP/qa.json"
          python3 - "$RUNNER_TEMP/qa.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          for run in data.get('workflow_runs', []):
              if run.get('conclusion') == 'success' and run.get('head_sha') and run.get('id'):
                  print('run_id=' + str(run['id']))
                  print('source_sha=' + run['head_sha'])
                  break
          else:
              raise SystemExit('No successful main emulator QA run found')
          PY
      - name: Download authentic Android screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.qa.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captures
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name focuslock-android-fullscreen-captures --dir captures
          for file in 14-home-granted.png 15-analysis-today.png 16-analysis-week.png; do
            test -s "captures/qa-captures/$file"
          done
      - name: Render two editorial screenshot-based concepts
        env:
          FOCUSLOCK_SOURCE_RUN: ${{ steps.qa.outputs.run_id }}
          FOCUSLOCK_SOURCE_SHA: ${{ steps.qa.outputs.source_sha }}
          FOCUSLOCK_CAPTURE_DIR: captures/qa-captures
          FOCUSLOCK_OUTPUT_DIR: generated/store-02-A
        shell: bash
        run: |
          python3 scripts/store/render_concepts.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json
          folder = Path('generated/store-02-A')
          manifest = json.loads((folder/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['status'] == 'review_only_not_uploaded'
          assert len(manifest['screenshots']) == 2
          for item in manifest['screenshots']:
              path = folder/item['file']
              with Image.open(path) as img:
                  assert img.format == 'PNG' and img.mode == 'RGB' and img.size == (1350, 2400)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
          print('STORE-02-A: 2/2 PNG RGB 1350x2400, SHA-256 validated')
          PY
      - name: Upload review-only concept images
        uses: actions/upload-artifact@v4
        with:
          name: focuslock-store-02-a-review
          path: generated/store-02-A/
          if-no-files-found: error
          retention-days: 30
      - name: Report no Google Play publication
        run: |
          echo 'STORE-02-A: two real-screen promotional concepts, design review only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Play API calls; no app icon, AAB, release track or store listing changes.' >> "$GITHUB_STEP_SUMMARY"
