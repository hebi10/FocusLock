name: STORE-01 FocusLock Korean Play images

on:
  pull_request:
    paths:
      - 'scripts/store/**'
      - '.github/workflows/store-01-images.yml'
      - 'docs/play-store/STORE-01.md'
      - 'docs/play-store/UI-R09.md'
  workflow_dispatch:
    inputs:
      mode:
        description: Validate screenshots or upload the approved Korean images
        type: choice
        required: true
        default: check
        options: [check, upload]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source selection and store renderer safety
        run: |
          python3 -m pip install 'Pillow==12.0.0'
          python3 -m unittest discover -s scripts/store -p 'test_*.py'

  generate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'issue_comment' &&
       github.repository == 'hebi10/FocusLock' &&
       github.event.issue.number == 14 &&
       github.event.comment.user.login == 'hebi10' &&
       github.event.comment.body == '/store-01-upload')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.capture.outputs.source_sha }}
      source_run: ${{ steps.capture.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install 'Pillow==12.0.0'
      - name: Resolve latest successful main emulator capture
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/emulator-smoke.yml/runs?branch=main&status=success&per_page=40" > "$RUNNER_TEMP/qa-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$RUNNER_TEMP/main-ref.json"
          python3 scripts/store/source_gate.py --runs "$RUNNER_TEMP/qa-runs.json" --main-ref "$RUNNER_TEMP/main-ref.json" >> "$GITHUB_OUTPUT"
      - name: Download real Android screenshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.capture.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p captures
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name focuslock-android-fullscreen-captures --dir captures
          test "$(find captures/qa-captures -maxdepth 1 -name '*.png' | wc -l)" -ge 37
      - name: Generate eight real-capture listing images and graphic
        env:
          SOURCE_SHA: ${{ steps.capture.outputs.source_sha }}
          SOURCE_RUN: ${{ steps.capture.outputs.run_id }}
        run: |
          python3 scripts/store/render_images.py --captures captures/qa-captures --output generated/ko-KR --source-sha "$SOURCE_SHA" --source-run "$SOURCE_RUN"
          python3 scripts/store/render_images.py --check --output generated/ko-KR
          python3 scripts/store/play_images.py --dir generated/ko-KR --report output/store-01-check.json
          python3 -m unittest discover -s scripts/store -p 'test_*.py'
      - name: Preserve validated images and SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: focuslock-store-01-ko-KR
          path: generated/ko-KR/
          if-no-files-found: error
          retention-days: 30
      - name: Report captured source and scope
        env:
          RUN_ID: ${{ steps.capture.outputs.run_id }}
          SOURCE_SHA: ${{ steps.capture.outputs.source_sha }}
        run: |
          echo "Actual Android screenshot source: $RUN_ID ($SOURCE_SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "8 RGB 1350x2400 phone screenshots + 1 RGB 1024x500 feature graphic; icon unchanged." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: generate
    if: >-
      github.repository == 'hebi10/FocusLock' &&
      ((github.event_name == 'issue_comment' &&
        github.event.issue.number == 14 &&
        github.event.comment.user.login == 'hebi10' &&
        github.event.comment.body == '/store-01-upload') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.mode == 'upload'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: google-play
    concurrency:
      group: play-com-haebi-focuslock
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python3 -m pip install 'Pillow==12.0.0'
      - name: Download exact validated listing images
        uses: actions/download-artifact@v4
        with:
          name: focuslock-store-01-ko-KR
          path: generated/ko-KR
      - name: Verify and save version-controlled listing assets
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
          EXPECTED_SOURCE_RUN: ${{ needs.generate.outputs.source_run }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA" || { echo "::error::main changed after image generation; refusing stale images"; exit 1; }
          python3 - "$EXPECTED_SOURCE_SHA" "$EXPECTED_SOURCE_RUN" <<'PY'
          import json, sys
          from pathlib import Path
          record = json.loads(Path('generated/ko-KR/manifest.json').read_text(encoding='utf-8'))
          if record.get('source_commit') != sys.argv[1] or record.get('source_workflow_run') != sys.argv[2]:
              raise SystemExit('Generated image provenance differs from current main and verified Android QA run')
          PY
          python3 scripts/store/render_images.py --check --output generated/ko-KR
          mkdir -p assets/play-store/ko-KR
          cp generated/ko-KR/*.png generated/ko-KR/manifest.json assets/play-store/ko-KR/
          python3 scripts/store/render_images.py --check --output assets/play-store/ko-KR
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/play-store/ko-KR/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(store): update FocusLock Play listing captures [skip ci]'
            git push origin HEAD:main
          fi
      - name: Authenticate with existing Google Play WIF
        uses: google-github-actions/auth@v3
        id: play_auth
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload only ko-KR phone screenshots and feature graphic
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
          PLAY_RELEASE_MODE: store-images
        run: |
          python3 scripts/store/play_images.py --dir assets/play-store/ko-KR --apply --report output/store-01-play-report.json
      - name: Preserve upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focuslock-store-01-play-result
          path: output/store-01-play-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Report Play result boundaries
        if: success()
        run: |
          echo "STORE-01 Korean image API edit committed and fresh readback matched." >> "$GITHUB_STEP_SUMMARY"
          echo "Icon, AAB/APK, internal/alpha tracks and other localizations unchanged by this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "Review approval and storefront visibility still require Play Console confirmation." >> "$GITHUB_STEP_SUMMARY"
